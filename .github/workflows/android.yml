# APK Android (Capacitor + câmera nativa CameraX).
# - push na main / manual: gera o APK assinado como artefato da execução.
# - tag v*: além disso, cria a Release com o APK para baixar no celular.
# O site (GitHub Pages) NÃO depende deste workflow: continua publicando sozinho.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
    # Só pula quando TODOS os arquivos alterados casam aqui (commit misto roda).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.nojekyll'
      - 'tools/make-icons.mjs'
      - 'vendor/**'   # detector de rosto: fica fora do APK
      - 'sw.js'       # service worker: o APK não usa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}-main', github.run_number) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dependências
        run: npm ci

      - name: Sintaxe do JS
        run: for f in js/*.js; do node --check "$f"; done

      - name: Web → www/ → projeto Android
        run: |
          node tools/build-web.mjs
          npx cap sync android

      - name: Keystore (secrets)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Secrets do keystore ausentes — o APK sai SEM assinatura (não instala). Veja README → APK Android."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build do APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura e permissões
        if: steps.ks.outputs.signed == 'true'
        env:
          EXPECTED: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          if [ -n "$EXPECTED" ] && [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Certificado mudou ($GOT ≠ $EXPECTED): o APK não atualizaria o app instalado."
            exit 1
          fi
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -E 'permission: ' perms.txt | grep -vE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|CAMERA|RECORD_AUDIO|REQUEST_INSTALL_PACKAGES|WAKE_LOCK)|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'; then
            echo "::error::Permissão inesperada no APK."
            exit 1
          fi
          cp "$APK" "teleprompter-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ks.outputs.signed == 'true'
        with:
          name: teleprompter-apk
          path: teleprompter-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teleprompter-apk
      - name: Release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" teleprompter-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Teleprompter $GITHUB_REF_NAME (APK)" \
            --notes "Baixe o arquivo .apk abaixo no celular e toque nele para instalar. Veja o README → APK Android."
